<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Política de segurança de conteúdo: o app só carrega código dele mesmo e dos serviços listados.
       Se uma falha de injeção aparecer, o navegador barra scripts de fora e o envio de dados a outros sites.
       Ao usar um serviço novo, inclua o endereço aqui (tests/nucleo.test.mjs confere os que o código usa). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.anthropic.com https://brasilapi.com.br https://www.googleapis.com https://openlibrary.org https://covers.openlibrary.org https://pt.wiktionary.org https://en.wiktionary.org https://api.dicionario-aberto.net https://api.dictionaryapi.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="Grifo: leituras que ficam. Fotografe seus grifos, conecte ideias e memorize o que leu.">
  <title>Grifo — leituras que ficam</title>
  <!-- prévia ao compartilhar o link (WhatsApp, Instagram, X, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Grifo">
  <meta property="og:title" content="Grifo — leituras que ficam">
  <meta property="og:description" content="Fotografe seus grifos, conecte ideias de livros diferentes e memorize o que leu.">
  <meta property="og:url" content="https://rafaelcataide.github.io/grifo/">
  <meta property="og:image" content="https://rafaelcataide.github.io/grifo/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <script src="js/tema.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> Grifo</a>
    <div class="row gap-s">
      <a href="#/busca" class="icon-btn" id="search-btn" aria-label="Buscar em tudo" title="Buscar em tudo (/)">🔎</a>
      <!-- conta e tema ficam em Ajustes; com conta, o botão mostra a foto -->
      <a href="#/ajustes" class="icon-btn" id="account-btn" aria-label="Ajustes e conta" title="Ajustes e conta">⚙️</a>
    </div>
  </header>

  <main id="view" class="container"></main>

  <div id="timer-bar" class="timer-bar" hidden></div>

  <nav class="tabbar">
    <a href="#/" data-tab="">🏠<span>Início</span></a>
    <a href="#/livros" data-tab="livros">📚<span>Leituras</span></a>
    <a href="#/notas" data-tab="notas">🕸️<span>Ideias</span></a>
    <a href="#/revisar" data-tab="revisar">🧠<span>Revisar</span><b class="tab-badge" id="due-badge" hidden></b></a>
    <a href="#/stats" data-tab="progresso">📊<span>Progresso</span></a>
  </nav>

  <dialog id="modal" tabindex="-1"><div id="modal-body"></div></dialog>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
